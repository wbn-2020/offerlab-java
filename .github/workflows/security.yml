name: Backend Dependency Audit

on:
  pull_request:
    paths:
      - "pom.xml"
      - "**/pom.xml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compute Dependency-Check cache epoch
        id: dependency_check_cache_epoch
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check data
        id: dependency_check_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-v12-${{ runner.os }}-${{ steps.dependency_check_cache_epoch.outputs.day }}
          restore-keys: |
            dependency-check-v12-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        id: dependency_check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          mvn -B -ntp -Psecurity-audit -DskipTests
          -Ddependency-check.failBuildOnCVSS=7.0
          ${{ secrets.NVD_API_KEY != '' && format('-DnvdApiKey={0}', secrets.NVD_API_KEY) || '' }}
          verify

      - name: Save Dependency-Check data
        if: >-
          always() &&
          steps.dependency_check_cache.outcome == 'success' &&
          steps.dependency_check_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ steps.dependency_check_cache.outputs.cache-primary-key }}

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check
          path: target/dependency-check-report.*
          if-no-files-found: warn

      - name: Upload SARIF
        if: >-
          always() &&
          hashFiles('target/dependency-check-report.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/dependency-check-report.sarif

      - name: Enforce Dependency-Check result
        if: always() && steps.dependency_check.outcome == 'failure'
        run: |
          echo "::error::OWASP Dependency-Check failed; inspect the uploaded reports."
          exit 1
