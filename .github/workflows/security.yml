name: Backend Dependency Audit

on:
  pull_request:
    paths:
      - "pom.xml"
      - "**/pom.xml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          mvn -B -ntp -Psecurity-audit -DskipTests
          -Ddependency-check.failBuildOnCVSS=7.0
          ${{ secrets.NVD_API_KEY != '' && format('-DnvdApiKey={0}', secrets.NVD_API_KEY) || '' }}
          verify

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check
          path: target/dependency-check-report.*
          if-no-files-found: warn

      - name: Upload SARIF
        if: >-
          always() &&
          hashFiles('target/dependency-check-report.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/dependency-check-report.sarif
