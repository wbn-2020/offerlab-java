# LOCAL DEVELOPMENT ONLY. NOT FOR ACCEPTANCE, STAGING, OR PRODUCTION.
# This compose file intentionally uses local passwords, plaintext Kafka, and
# Elasticsearch security disabled for isolated developer machines. Do not reuse
# it for acceptance, staging, or production; use the acceptance/prod profile with
# external secrets and authenticated managed services instead.
services:
  mysql:
    image: mysql:8.0
    container_name: offerlab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-offerlab-local-root-change-me}
      MYSQL_DATABASE: offerlab
      MYSQL_USER: offerlab
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-offerlab-local-db-change-me}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: offerlab-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-offerlab-local-redis-change-me}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping 2>/dev/null | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka:
    image: bitnami/kafka:3.6
    container_name: offerlab-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: yes
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: offerlab-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:9200/_cluster/health >/dev/null
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  # Optional analytics dependency for future stages.
  # clickhouse:
  #   image: clickhouse/clickhouse-server:24.1
  #   ...

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  elasticsearch_data:
