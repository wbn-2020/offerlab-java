# OfferLab local Kafka KRaft profile for Windows foreground demos.
# This file is project-owned; scripts do not overwrite the Kafka installation config.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093

listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://localhost:9092
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT

log.dirs=C:/codeware/kafka-data/offerlab-kraft-combined-logs
metadata.log.dir=C:/codeware/kafka-data/offerlab-metadata

num.partitions=1
default.replication.factor=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=true

# Avoid local Windows demo failures caused by retention deleting locked *.timeindex files.
# Use a throwaway formatted local data directory for long-running retention tests.
log.retention.ms=-1
log.retention.bytes=-1
log.cleanup.policy=delete
log.segment.bytes=1073741824
log.retention.check.interval.ms=3600000

