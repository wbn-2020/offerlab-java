spring:
  application:
    name: offerlab-community
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: ${OFFERLAB_FLYWAY_ENABLED:true}
    locations: ${OFFERLAB_FLYWAY_LOCATIONS:classpath:db/flyway/core}
    table: ${OFFERLAB_FLYWAY_TABLE:flyway_schema_history}
    baseline-on-migrate: ${OFFERLAB_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: "0"
    baseline-description: legacy schema baseline
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    clean-disabled: true
    connect-retries: ${OFFERLAB_FLYWAY_CONNECT_RETRIES:10}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: offerlab-community
      auto-offset-reset: latest
      enable-auto-commit: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.offerlab.community
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-not-delete-value: 0
      logic-delete-value: 1
      id-type: input
      insert-strategy: not_null
      update-strategy: not_null
      select-strategy: not_null

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

offerlab:
  id:
    snowflake:
      worker-id: ${OFFERLAB_SNOWFLAKE_WORKER_ID}
      datacenter-id: ${OFFERLAB_SNOWFLAKE_DATACENTER_ID}
  redis:
    pubsub-enabled: ${OFFERLAB_REDIS_PUBSUB_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: 168
  feed:
    bigv-threshold: 1000
    inbox-capacity: 1000
    inbox-ttl-seconds: 604800
  kafka:
    enabled: ${OFFERLAB_KAFKA_ENABLED}
    listener-concurrency: ${OFFERLAB_KAFKA_LISTENER_CONCURRENCY:1}
    # Keep local single-broker development at 1; production can raise this with topic partitions.
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED}
    url: ${ELASTICSEARCH_URL}
    post-index: post_idx
    connect-timeout-millis: 800
    request-timeout-millis: 1500
  realtime:
    websocket-enabled: ${OFFERLAB_REALTIME_WEBSOCKET_ENABLED:false}
  subscription-delivery:
    enabled: ${OFFERLAB_SUBSCRIPTION_DELIVERY_ENABLED:true}
    topic-enabled: ${OFFERLAB_SUBSCRIPTION_DELIVERY_TOPIC_ENABLED:true}
    discussion-enabled: ${OFFERLAB_SUBSCRIPTION_DELIVERY_DISCUSSION_ENABLED:true}
    need-enabled: ${OFFERLAB_SUBSCRIPTION_DELIVERY_NEED_ENABLED:true}
  incentive:
    ai-assist-entitlement-enabled: ${OFFERLAB_AI_ASSIST_ENTITLEMENT_ENABLED:false}
    entitlement-reservation:
      enabled: ${OFFERLAB_ENTITLEMENT_RESERVATION_ENABLED:true}
      ttl-seconds: ${OFFERLAB_ENTITLEMENT_RESERVATION_TTL_SECONDS:120}
      recovery-batch-size: ${OFFERLAB_ENTITLEMENT_RESERVATION_RECOVERY_BATCH_SIZE:100}
      recovery-delay-ms: ${OFFERLAB_ENTITLEMENT_RESERVATION_RECOVERY_DELAY_MS:5000}
  ai:
    content-assist:
      enhanced-enabled: ${OFFERLAB_CONTENT_ASSIST_ENHANCED_ENABLED:false}
      enhanced-result-retention-hours: ${OFFERLAB_CONTENT_ASSIST_ENHANCED_RESULT_RETENTION_HOURS:24}
      enhanced-cleanup-batch-size: ${OFFERLAB_CONTENT_ASSIST_ENHANCED_CLEANUP_BATCH_SIZE:100}
      enhanced-request-timeout-seconds: ${OFFERLAB_CONTENT_ASSIST_ENHANCED_REQUEST_TIMEOUT_SECONDS:120}
      enhanced-execution-grace-seconds: ${OFFERLAB_CONTENT_ASSIST_ENHANCED_EXECUTION_GRACE_SECONDS:30}
      enhanced-recovery-delay-ms: ${OFFERLAB_CONTENT_ASSIST_ENHANCED_RECOVERY_DELAY_MS:10000}
      enhanced-ops-reconcile-enabled: ${OFFERLAB_CONTENT_ASSIST_ENHANCED_OPS_RECONCILE_ENABLED:false}

logging:
  level:
    root: INFO
    com.offerlab.community: ${OFFERLAB_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    enabled: ${OFFERLAB_FLYWAY_ENABLED:false}
