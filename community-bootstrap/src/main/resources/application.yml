spring:
  application:
    name: offerlab-community
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: offerlab-community
      auto-offset-reset: latest
      enable-auto-commit: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.offerlab.community
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-not-delete-value: 0
      logic-delete-value: 1
      id-type: input
      insert-strategy: not_null
      update-strategy: not_null
      select-strategy: not_null

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

offerlab:
  redis:
    pubsub-enabled: ${OFFERLAB_REDIS_PUBSUB_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: 168
  feed:
    bigv-threshold: 1000
    inbox-capacity: 1000
    inbox-ttl-seconds: 604800
  kafka:
    enabled: ${OFFERLAB_KAFKA_ENABLED}
    listener-concurrency: ${OFFERLAB_KAFKA_LISTENER_CONCURRENCY:1}
    # Keep local single-broker development at 1; production can raise this with topic partitions.
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED}
    url: ${ELASTICSEARCH_URL}
    post-index: post_idx
    connect-timeout-millis: 800
    request-timeout-millis: 1500
  realtime:
    websocket-enabled: ${OFFERLAB_REALTIME_WEBSOCKET_ENABLED:false}

logging:
  level:
    root: INFO
    com.offerlab.community: ${OFFERLAB_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
