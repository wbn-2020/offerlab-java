spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    baseline-on-migrate: ${OFFERLAB_FLYWAY_BASELINE_ON_MIGRATE:false}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:__acceptance_kafka_not_configured__}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.offerlab.community: ${OFFERLAB_LOG_LEVEL:INFO}

offerlab:
  admin:
    local-open-enabled: false
    uid-whitelist: ${OFFERLAB_ADMIN_UIDS:}
  redis:
    pubsub-enabled: ${OFFERLAB_REDIS_PUBSUB_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: ${JWT_TTL_HOURS:8}
  kafka:
    enabled: ${OFFERLAB_KAFKA_ENABLED:false}
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:false}
    url: ${ELASTICSEARCH_URL:__acceptance_elasticsearch_not_configured__}
  realtime:
    websocket-enabled: ${OFFERLAB_REALTIME_WEBSOCKET_ENABLED:false}
  web:
    cors:
      allowed-origins: ${OFFERLAB_WEB_CORS_ALLOWED_ORIGINS}
