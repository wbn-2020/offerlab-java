# dev profile overrides.
spring:
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.offerlab.community: ${OFFERLAB_LOG_LEVEL:INFO}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

offerlab:
  redis:
    pubsub-enabled: ${OFFERLAB_REDIS_PUBSUB_ENABLED:false}
  kafka:
    enabled: ${OFFERLAB_KAFKA_ENABLED:true}
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:true}
  realtime:
    websocket-enabled: ${OFFERLAB_REALTIME_WEBSOCKET_ENABLED:false}
